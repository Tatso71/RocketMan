<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RocketMan · Cataloghi e interfaccia</title>
<style>
:root{--bg:#101e2c;--panel:#192c3b;--surface:#233b4a;--text:#eef4ed;--muted:#adc1c4;--accent:#8bd6cf;--warn:#edc57b;--danger:#e99c8b;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.5 system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,select,input{min-height:44px;border:1px solid #405968;border-radius:10px;background:var(--surface);padding:8px 14px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:3px}button.active,.primary{background:var(--accent);color:#122633;border-color:var(--accent)}button:disabled{opacity:.55;cursor:not-allowed}a{color:var(--accent)}header{padding:24px 32px 20px;border-bottom:1px solid #314857;display:flex;justify-content:space-between;gap:20px;align-items:center}header strong{letter-spacing:.12em;font-size:23px}header small{display:block;color:var(--muted);letter-spacing:0;font-size:15px}nav{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1600px;margin:auto;padding:28px 32px}h1{font-size:32px;line-height:1.2;margin:0 0 12px}h2{font-size:23px;margin:0 0 16px}h3{font-size:20px;margin:6px 0}p{margin:8px 0 16px}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-size:13px;font-weight:700}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--panel);border:1px solid #314957;border-radius:16px;padding:22px}.badge{font-size:14px;background:#2d4555;color:var(--accent);border-radius:6px;padding:3px 8px;display:inline-block}.big{font-size:34px;font-weight:700}.metric{font-size:16px;color:var(--muted)}.metric b{display:block;color:var(--text);font-size:24px}.icon{width:64px;height:64px;object-fit:contain}.tiny-icon{width:36px;height:36px;vertical-align:middle}.hero-icon{width:120px;height:120px}.status{border-left:4px solid var(--accent);padding:10px 14px;background:#18343e;border-radius:5px;margin:16px 0}.status.warn{border-color:var(--warn);background:#3b3429}.status.error{border-color:var(--danger);background:#3b2d31}.tabs{margin:20px 0;display:flex;gap:10px;flex-wrap:wrap}.step{display:inline-flex;align-items:center;gap:8px}.step span{border:1px solid #49646d;border-radius:50%;width:30px;height:30px;text-align:center}.step.done span{background:var(--accent);color:#122633}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:450px;margin:20px auto}.cell{aspect-ratio:1;border-radius:3px;border:1px solid #375c67;background:#2a4a51;display:grid;place-items:center;font-size:13px}.cell.reserve{background:#416c6a;border-color:var(--accent)}.cell.rock{background:#725244;border-color:#bc8a68}.cost-item{padding:9px 12px;border-radius:9px;background:var(--surface);display:flex;gap:10px;align-items:center;margin:8px 0}.cost-item img{width:36px;height:36px}.toolbar{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:240px}.catalog-layout{display:grid;grid-template-columns:210px 1fr;gap:24px}.category{width:100%;text-align:left;margin-bottom:7px;display:flex;justify-content:space-between;gap:6px;font-size:16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.entity{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border-radius:14px;padding:18px;min-height:176px;background:var(--panel)}.entity .title{font-size:18px;font-weight:700;margin:10px 0 2px}.entity code{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.entity .desc{font-size:14px;color:var(--muted);margin-top:8px}.topline{display:flex;justify-content:space-between;width:100%;align-items:center}.planet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.planet{min-height:152px;display:flex;flex-direction:column;align-items:center;text-align:center}.planet.selected{border-color:var(--accent);box-shadow:0 0 0 2px #8bd6cf44}.ledger{width:100%;border-collapse:collapse}.ledger th,.ledger td{text-align:left;border-bottom:1px solid #37505d;padding:12px 8px;font-size:16px}.ledger th{color:var(--muted);font-weight:500}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.timeline .card{border-top:3px solid var(--accent)}.bar{height:9px;background:#324a58;border-radius:10px;overflow:hidden;margin:8px 0}.bar i{display:block;background:var(--accent);height:100%;border-radius:10px}.material{background:var(--panel);border:1px solid #314957;border-radius:12px;overflow:hidden}.material img{width:100%;height:130px;object-fit:cover}.material div{padding:14px}.footnote{font-size:14px;color:var(--muted);margin-top:28px}.hidden{display:none!important}dialog{width:min(900px,94vw);max-height:90vh;background:var(--bg);color:var(--text);border:1px solid #4b6c78;border-radius:18px;padding:28px}dialog::backdrop{background:#05111bd9}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#0b1721;padding:16px;border-radius:10px;max-height:350px;overflow:auto}.dependencies{margin:0;padding-left:22px}.dependencies li{margin:7px 0}.notice{font-size:14px;color:var(--warn)}@media(max-width:1000px){.split,.three{grid-template-columns:1fr}.planet-grid,.timeline{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}.catalog-layout{grid-template-columns:1fr}.categories{display:flex;gap:8px;overflow:auto}.category{min-width:170px}.three .card{padding:18px}}@media(max-width:600px){main,header{padding:20px}.timeline,.planet-grid{grid-template-columns:1fr 1fr}h1{font-size:27px}}
</style>
</head>
<body>
<header><div><strong>ROCKETMAN</strong><small>Design v1 · Cataloghi per l’AI e anteprima GUI</small></div><nav aria-label="Vista principale"><button class="active" data-view="flows">Flussi di gioco</button><button data-view="catalog">Cataloghi</button><button data-view="progression">Progressione</button><button data-view="materials">Materiali</button></nav></header>
<main id="main"></main>
<dialog id="details"><div class="row" style="justify-content:space-between"><span class="eyebrow">Scheda di progetto</span><button id="close-details" aria-label="Chiudi scheda">Chiudi ×</button></div><div id="detail-content"></div></dialog>
<script>
/*__DESIGN_DATA__*/
const names={resources:'Risorse',recipes:'Ricette',modules:'Cubi e impianti',planets:'Pianeti',research:'Ricerca',upgrades:'Upgrade',creatures:'Creature',hazards:'Pericoli',currencies:'Cristalli',tools:'Strumenti',services:'Cura e servizi',items:'Equipaggiamento'};
const entities=Object.values(D).filter(Array.isArray).flat();
const byId=new Map(entities.map(x=>[x.id,x]));
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const name=id=>byId.get(id)?.name_it||id||'Sul campo';
const asset=id=>'../../assets/design/icons/'+id+'.svg';
const img=(id,cls='icon')=>'<img class="'+cls+'" src="'+asset(id)+'" alt="" loading="lazy">';
const costs=o=>Object.entries(o||{}).map(([k,v])=>v+' '+name(k)).join(' + ')||'Nessun materiale';
let state={view:'flows',flow:'build',category:'modules',search:'',stage:'all',planet:'planet_ocra',buildStep:0,blocked:false,pinned:null};
const steps=['Fabbrica','Trasporta','Posa','Dispiegamento'];
function flowTabs(){return '<div class="tabs">'+[['build','Costruzione'],['navigation','Navigazione'],['inventory','Inventario'],['care','Cura e manutenzione']].map(([id,n])=>'<button data-flow="'+id+'" class="'+(state.flow===id?'active':'')+'">'+n+'</button>').join('')+'</div>';}
function costCards(o){return Object.entries(o).map(([id,n])=>'<div class="cost-item">'+img(id)+'<span>'+esc(name(id))+'</span><b style="margin-left:auto">'+n+'</b></div>').join('');}
function buildFlow(){
const m=byId.get('mod_lab'),r=byId.get('recipe_cube_lab');
const status=state.blocked?'Spazio occupato: scava ancora 1 cella prima di posare il cubo.':state.buildStep===0?'L’officina può fabbricare il cubo. Lo spazio di uscita è disponibile.':state.buildStep===1?'Cubo pronto: occupa 4 delle 8 unità dello zaino.':state.buildStep===2?'Spazio verificato: 4 × 3 m liberi, pavimento e passaggio accessibili.':'Laboratorio attivo: deposito 32 unità e ricerca disponibili.';
return '<div class="split"><section class="card"><span class="eyebrow">Primo obiettivo · Ocra</span><div class="row">'+img(m.id,'hero-icon')+'<div><h2>Cubo laboratorio</h2><span class="badge">Spiegato: 4 × 3 m</span><p class="muted">Chiuso: 4 unità di carico · Montaggio: 5 s</p></div></div><p>Libera il volume, porta il cubo e avvia il montaggio. Il cubo non scava.</p>'+costCards(r.inputs)+'<div class="row" style="margin:22px 0">'+steps.map((s,i)=>'<div class="step '+(state.buildStep>=i?'done':'')+'"><span>'+(i+1)+'</span>'+s+'</div>').join('')+'</div><button class="primary" id="build-next" '+(state.blocked&&state.buildStep===2?'disabled':'')+'>'+["Fabbrica il cubo","Trasporta nello zaino","Posa e avvia il montaggio","Laboratorio attivo · Ricomincia prova"][state.buildStep]+'</button> <button data-detail="mod_lab">Scheda completa</button></section><section class="card"><h2>Anteprima sul terreno</h2><p class="muted">Ogni cella misura 1 metro. L’area verde mostra l’ingombro completo.</p><div class="grid">'+Array.from({length:30},(_,i)=>{let x=i%6,y=Math.floor(i/6);return '<div class="cell '+((y===4||x===0||x===5)?'rock':state.blocked&&x===3&&y===2?'rock':'reserve')+'">'+((state.blocked&&x===3&&y===2)?'!':'')+'</div>';}).join('')+'</div><label class="row"><input id="obstruction" type="checkbox" '+(state.blocked?'checked':'')+'>Simula una cella da scavare</label><div class="status '+(state.blocked?'error':'')+'" role="status">'+status+'</div><div class="row"><span class="metric">Energia<b>0,2 kW</b></span><span class="metric">Deposito<b>32 unità</b></span><span class="metric">Luce collegata<b>8 m</b></span></div></section></div>';
}
function navFlow(){const p=byId.get(state.planet);return '<div class="split"><div class="planet-grid">'+D.planets.map(x=>'<button data-planet="'+x.id+'" class="planet card '+(x.id===p.id?'selected':'')+'">'+img(x.id)+'<strong>'+x.name_it+'</strong><small class="muted">Fase '+x.stage+'</small></button>').join('')+'</div><section class="card"><span class="eyebrow">Destinazione selezionata</span><h2>'+p.name_it+'</h2><p>'+p.landing_biome+'</p><p class="muted">Accesso: '+name(p.required_research)+'</p><h3>Cosa cercare</h3>'+p.primary_resources.map(id=>'<button data-detail="'+id+'" style="margin:4px">'+img(id,'tiny-icon')+' '+name(id)+'</button>').join('')+'<h3 style="margin-top:20px">Pericoli rilevati</h3><p>'+p.hazards.map(name).join(' · ')+'</p><div class="status">Carburante rotta '+p.route_fuel+' + decollo '+p.takeoff_fuel+' + ritorno e riserva da verificare prima della partenza.</div><p>La mappa mostra risorse note del pianeta. Le vene non scansionate restano nascoste.</p><button data-detail="'+p.id+'">Rilievi e dati di progetto</button></section></div>';}
function inventoryFlow(){return '<div class="three">'+[['Zaino','2 / 8','res_soil',2,'Presso il personaggio'],['Robbie','4 / 12','res_copper',4,'Connesso · a 2 metri'],['Officina selezionata','34 / 120','res_stone',12,'Accessibile soltanto a bordo']].map(([n,cap,id,amount,sub])=>'<section class="card"><span class="eyebrow">'+sub+'</span><h2>'+n+'</h2><div class="big">'+cap+'</div><p class="muted">unità occupate</p>'+costCards({[id]:amount})+'<button data-detail="'+id+'">Ispeziona materiale</button></section>').join('')+'</div><div class="status">Il menu reale deve eseguire trasferimenti locali: le quantità dell’astronave non diventano disponibili sottoterra. Questa anteprima mostra la disposizione dei tre depositi.</div>';}
function careFlow(){return '<div class="three">'+[['Personaggio','Livello 6 · Specializzazione esploratore','upg_player_suit','Salute',74,'Ferita lieve','Riposo a bordo o trattamento in infermeria.'],['Astronave','Livello 3 · 3 agganci disponibili','upg_ship_hull','Scafo',68,'Usura da atterraggio','2 pietra + 1 rame ripristinano 25 integrità.'],['Robbie','Carico 16 · segnale 20 m','upg_robbie_hull','Integrità',82,'Batteria al 60%','Rientra a una stazione Robbie o all’officina.']].map(([n,level,id,stat,v,cond,remedy])=>'<section class="card">'+img(id)+'<h2>'+n+'</h2><p class="muted">'+level+'</p><div class="row"><b>'+stat+'</b><span style="margin-left:auto">'+v+' / 100</span></div><div class="bar"><i style="width:'+v+'%"></i></div><div class="status warn">'+cond+'</div><p>'+remedy+'</p><button data-detail="'+id+'">Confronta i potenziamenti</button></section>').join('')+'</div><div class="status">Soccorso: nessuna perdita di esperienza, cristalli o creature. Metà di ogni materiale trasportato resta in un deposito recuperabile, senza scadenza.</div>';}
function flows(){return '<span class="eyebrow">Anteprima dell’interfaccia</span><h1>Un obiettivo chiaro, il prossimo passo visibile</h1><p class="muted">Quattro flussi consultabili. Dati di gioco reali del catalogo, stati di esempio per provare la GUI.</p>'+flowTabs()+({build:buildFlow,navigation:navFlow,inventory:inventoryFlow,care:careFlow}[state.flow])();}
function filtered(category=state.category){return (D[category]||[]).filter(x=>(state.stage==='all'||String(x.stage)===state.stage)&&(!state.search||JSON.stringify(x).toLowerCase().includes(state.search.toLowerCase())));}
function catalog(){let a=filtered();return '<span class="eyebrow">Specifiche organizzate per l’AI</span><h1>Cataloghi e dipendenze</h1><div class="toolbar"><input id="search" aria-label="Cerca in tutti i dati della categoria" placeholder="Cerca un nome, un ID o un ingrediente…" value="'+esc(state.search)+'"><select id="stage" aria-label="Filtra per fase"><option value="all">Tutte le fasi</option>'+Array.from({length:8},(_,i)=>'<option value="'+i+'" '+(state.stage===String(i)?'selected':'')+'>Fase '+i+'</option>').join('')+'</select></div><div class="catalog-layout"><aside class="categories">'+Object.entries(names).map(([id,n])=>'<button class="category '+(id===state.category?'active':'')+'" data-category="'+id+'">'+n+' <span>'+D[id].length+'</span></button>').join('')+'</aside><section><p class="muted">'+a.length+' elementi · apri una scheda per ingredienti e dati strutturati</p><div class="cards">'+a.map(e=>{let ico=e.id.startsWith('recipe_')?Object.keys(e.outputs)[0]:e.id;return '<button class="entity" data-detail="'+e.id+'"><div class="topline">'+img(ico)+(e.stage!==undefined?'<span class="badge">Fase '+e.stage+'</span>':'')+'</div><span class="title">'+esc(e.name_it)+'</span><code>'+e.id+'</code><span class="desc">'+esc(e.footprint_m?e.footprint_m.join(' × ')+' m · '+e.packed_inventory_units+' carico':e.inputs?costs(e.inputs):e.primary_planets?.length?e.primary_planets.map(name).join(', '):e.owner||e.biome||'Apri la scheda')+'</span></button>';}).join('')+'</div></section></div>';}
function progression(){return '<span class="eyebrow">12 pianeti · complessità graduale</span><h1>Dal primo tunnel all’atlante concorde</h1><p class="muted">I rami si incontrano attraverso materiali e tecnologie. Le capacità delle creature restano facoltative per il percorso principale.</p><div class="timeline">'+D.progression.stages.map(s=>'<section class="card"><span class="badge">Fase '+s.stage+'</span><h2 style="margin-top:14px">'+s.planets.map(name).join(' e ')+'</h2><p>'+s.systems.join(' · ')+'</p><p class="muted">Prossima ricerca: '+(s.next_research.map(name).join(', ')||'Universo persistente')+'</p><button data-detail="'+s.critical_output+'">Risultato chiave</button></section>').join('')+'</div><h2 style="margin-top:30px">Primi 30 minuti, obiettivi di bilanciamento</h2><table class="ledger"><thead><tr><th>Minuto</th><th>Azione</th><th>Sistema introdotto</th></tr></thead><tbody>'+D.progression.onboarding.map(s=>'<tr><td>'+s.target_minute+'</td><td>'+s.goal+'</td><td>'+s.systems.join(', ')+'</td></tr>').join('')+'</tbody></table>';
}
function materials(){return '<span class="eyebrow">Materiali grafici e icone</span><h1>Superfici leggibili e creature aliene 3D</h1><p class="muted">76 tile SVG periodici e materiali Godot. Campioni di stile per prototipo; modelli 3D e mappe PBR definitive richiedono produzione dedicata.</p><div class="card" style="margin-bottom:24px"><h2>36 specie · direzione da Space Digger</h2><img src="../../assets/design/concepts/creatures-36-alien.png" alt="Tavola di 36 creature aliene originali, amichevoli e simpatiche" style="width:100%;border-radius:12px"></div><div class="cards">'+D.resources.map(r=>'<button class="material" data-detail="'+r.id+'"><img src="../../'+r.visual.tile+'" alt="Superficie '+r.name_it+'" loading="lazy"><div class="row">'+img(r.id,'tiny-icon')+'<span>'+r.name_it+'</span></div></button>').join('')+'</div>';}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$('#main').innerHTML=({flows,catalog,progression,materials}[state.view])()+'<p class="footnote">Design v1 · Specifica proposta, non implementazione del runtime. Fonte: <a href="../v1/manifest.json">manifest JSON</a> · <a href="../../docs/design/README.md">istruzioni per l’AI</a> · <a href="../../docs/design/validation-report.json">verifica automatica</a></p>';}
function ingredientsTree(id,seen=new Set(),depth=0){if(depth>5||seen.has(id))return '';const recipe=D.recipes.find(r=>Object.hasOwn(r.outputs,id));if(!recipe)return '<li>'+esc(name(id))+' · '+(byId.get(id)?.primary_planets?.map(name).join(', ')||'risorsa locale')+'</li>';const next=new Set(seen).add(id);return '<li>'+esc(name(id))+' · '+esc(name(recipe.station))+'<ul>'+Object.entries(recipe.inputs).map(([k,n])=>'<li>'+n+' '+esc(name(k))+(D.recipes.some(r=>Object.hasOwn(r.outputs,k))?'<ul>'+ingredientsTree(k,next,depth+1)+'</ul>':' · '+(byId.get(k)?.primary_planets?.map(name).join(', ')||''))+'</li>').join('')+'</ul></li>';}
function detail(id){const e=byId.get(id);if(!e)return;let recipes=e.id.startsWith('recipe_')?[e]:D.recipes.filter(r=>Object.hasOwn(r.outputs,id));let body='<div class="row" style="margin:15px 0">'+img(e.id.startsWith('recipe_')?Object.keys(e.outputs)[0]:e.id,'hero-icon')+'<div><h1>'+esc(e.name_it)+'</h1><code>'+e.id+'</code></div></div>';
if(e.footprint_m)body+=e.kind==='manual_infrastructure'?'<div class="status">Costruzione manuale immediata · '+e.footprint_m.join(' × ')+' m · Nessun cubo, postazione o energia</div>':'<div class="status">Cubo chiuso: '+e.packed_inventory_units+' unità · Modulo aperto: '+e.footprint_m.join(' × ')+' m · '+e.power_kw+' kW</div>';
if(recipes.length)body+='<h2>Come si costruisce</h2>'+recipes.map(r=>'<p><b>'+esc(name(r.station))+'</b> · '+esc(name(r.research))+(r.category==='manual_construction'?' · Costruzione immediata · 0 s · 0 kWh · Nessun cubo':'')+'</p>'+costCards(r.inputs)).join('')+'<button class="primary" id="pin-recipe" data-pin="'+id+'">Segna come obiettivo</button><h3 style="margin-top:20px">Catena degli ingredienti</h3><ul class="dependencies">'+ingredientsTree(e.id.startsWith('recipe_')?Object.keys(e.outputs)[0]:e.id)+'</ul>';
if(e.crafting_recipes)body+='<h2 style="margin-top:22px">Cosa può costruire</h2>'+e.crafting_recipes.map(r=>'<button data-detail="'+r+'" style="margin:4px">'+esc(name(r))+'</button>').join('');
if(e.levels)body+='<h2>Livelli e costi</h2>'+e.levels.map(l=>'<div class="status"><b>Livello '+l.level+': '+esc(JSON.stringify(l.value))+'</b><br>'+esc(costs(l.cost_items))+'<br>'+esc(costs(l.cost_currency))+' · '+esc(name(l.required_research))+'</div>').join('');
body+='<h2 style="margin-top:24px">Dati per l’implementazione</h2><pre>'+esc(JSON.stringify(e,null,2))+'</pre>';$('#detail-content').innerHTML=body;if(!$('#details').open)$('#details').showModal();}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;render();}if(b.dataset.flow){state.flow=b.dataset.flow;render();}if(b.dataset.category){state.category=b.dataset.category;state.search='';render();}if(b.dataset.planet){state.planet=b.dataset.planet;render();}if(b.dataset.detail)detail(b.dataset.detail);if(b.id==='build-next'){state.buildStep=(state.buildStep+1)%4;render();}if(b.id==='close-details')$('#details').close();if(b.dataset.pin){state.pinned=b.dataset.pin;b.textContent='Obiettivo segnato: '+name(state.pinned);b.disabled=true;}});
document.addEventListener('change',ev=>{if(ev.target.id==='stage'){state.stage=ev.target.value;render();}if(ev.target.id==='obstruction'){state.blocked=ev.target.checked;render();}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){const n=ev.target.selectionStart;state.search=ev.target.value;render();$('#search').focus();$('#search').setSelectionRange(n,n);}});
render();
</script>
</body>
</html>
