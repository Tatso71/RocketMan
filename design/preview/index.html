function flows(){return '<span class="eyebrow">Anteprima dell’interfaccia</span><h1>Un obiettivo chiaro, il prossimo passo visibile</h1><p class="muted">Quattro flussi consultabili. Dati di gioco reali del catalogo, stati di esempio per provare la GUI.</p>'+flowTabs()+({build:buildFlow,navigation:navFlow,inventory:inventoryFlow,care:careFlow}[state.flow])();}
function filtered(category=state.category){return (D[category]||[]).filter(x=>(state.stage==='all'||String(x.stage)===state.stage)&&(!state.search||JSON.stringify(x).toLowerCase().includes(state.search.toLowerCase())));}
function catalog(){let a=filtered();return '<span class="eyebrow">Specifiche organizzate per l’AI</span><h1>Cataloghi e dipendenze</h1><div class="toolbar"><input id="search" aria-label="Cerca in tutti i dati della categoria" placeholder="Cerca un nome, un ID o un ingrediente…" value="'+esc(state.search)+'"><select id="stage" aria-label="Filtra per fase"><option value="all">Tutte le fasi</option>'+Array.from({length:8},(_,i)=>'<option value="'+i+'" '+(state.stage===String(i)?'selected':'')+'>Fase '+i+'</option>').join('')+'</select></div><div class="catalog-layout"><aside class="categories">'+Object.entries(names).map(([id,n])=>'<button class="category '+(id===state.category?'active':'')+'" data-category="'+id+'">'+n+' <span>'+D[id].length+'</span></button>').join('')+'</aside><section><p class="muted">'+a.length+' elementi · apri una scheda per ingredienti e dati strutturati</p><div class="cards">'+a.map(e=>{let ico=e.id.startsWith('recipe_')?Object.keys(e.outputs)[0]:e.id;return '<button class="entity" data-detail="'+e.id+'"><div class="topline">'+img(ico)+(e.stage!==undefined?'<span class="badge">Fase '+e.stage+'</span>':'')+'</div><span class="title">'+esc(e.name_it)+'</span><code>'+e.id+'</code><span class="desc">'+esc(e.footprint_m?e.footprint_m.join(' × ')+' m · '+e.packed_inventory_units+' carico':e.inputs?costs(e.inputs):e.primary_planets?.length?e.primary_planets.map(name).join(', '):e.owner||e.biome||'Apri la scheda')+'</span></button>';}).join('')+'</div></section></div>';}
function progression(){return '<span class="eyebrow">12 pianeti · complessità graduale</span><h1>Dal primo tunnel all’atlante concorde</h1><p class="muted">I rami si incontrano attraverso materiali e tecnologie. Le capacità delle creature restano facoltative per il percorso principale.</p><div class="timeline">'+D.progression.stages.map(s=>'<section class="card"><span class="badge">Fase '+s.stage+'</span><h2 style="margin-top:14px">'+s.planets.map(name).join(' e ')+'</h2><p>'+s.systems.join(' · ')+'</p><p class="muted">Prossima ricerca: '+(s.next_research.map(name).join(', ')||'Universo persistente')+'</p><button data-detail="'+s.critical_output+'">Risultato chiave</button></section>').join('')+'</div><h2 style="margin-top:30px">Primi 30 minuti, obiettivi di bilanciamento</h2><table class="ledger"><thead><tr><th>Minuto</th><th>Azione</th><th>Sistema introdotto</th></tr></thead><tbody>'+D.progression.onboarding.map(s=>'<tr><td>'+s.target_minute+'</td><td>'+s.goal+'</td><td>'+s.systems.join(', ')+'</td></tr>').join('')+'</tbody></table>';
}
function materials(){return '<span class="eyebrow">Materiali grafici e icone</span><h1>Superfici leggibili e creature aliene 3D</h1><p class="muted">76 tile SVG periodici e materiali Godot. Campioni di stile per prototipo; modelli 3D e mappe PBR definitive richiedono produzione dedicata.</p><div class="card" style="margin-bottom:24px"><h2>36 specie · direzione da Space Digger</h2><img src="../../assets/design/concepts/creatures-36-alien.png" alt="Tavola di 36 creature aliene originali, amichevoli e simpatiche" style="width:100%;border-radius:12px"></div><div class="cards">'+D.resources.map(r=>'<button class="material" data-detail="'+r.id+'"><img src="../../'+r.visual.tile+'" alt="Superficie '+r.name_it+'" loading="lazy"><div class="row">'+img(r.id,'tiny-icon')+'<span>'+r.name_it+'</span></div></button>').join('')+'</div>';}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$('#main').innerHTML=({flows,catalog,progression,materials}[state.view])()+'<p class="footnote">Design v1 · Specifica proposta, non implementazione del runtime. Fonte: <a href="../v1/manifest.json">manifest JSON</a> · <a href="../../docs/design/README.md">istruzioni per l’AI</a> · <a href="../../docs/design/validation-report.json">verifica automatica</a></p>';}
function ingredientsTree(id,seen=new Set(),depth=0){if(depth>5||seen.has(id))return '';const recipe=D.recipes.find(r=>Object.hasOwn(r.outputs,id));if(!recipe)return '<li>'+esc(name(id))+' · '+(byId.get(id)?.primary_planets?.map(name).join(', ')||'risorsa locale')+'</li>';const next=new Set(seen).add(id);return '<li>'+esc(name(id))+' · '+esc(name(recipe.station))+'<ul>'+Object.entries(recipe.inputs).map(([k,n])=>'<li>'+n+' '+esc(name(k))+(D.recipes.some(r=>Object.hasOwn(r.outputs,k))?'<ul>'+ingredientsTree(k,next,depth+1)+'</ul>':' · '+(byId.get(k)?.primary_planets?.map(name).join(', ')||''))+'</li>').join('')+'</ul></li>';}
function detail(id){const e=byId.get(id);if(!e)return;let recipes=e.id.startsWith('recipe_')?[e]:D.recipes.filter(r=>Object.hasOwn(r.outputs,id));let body='<div class="row" style="margin:15px 0">'+img(e.id.startsWith('recipe_')?Object.keys(e.outputs)[0]:e.id,'hero-icon')+'<div><h1>'+esc(e.name_it)+'</h1><code>'+e.id+'</code></div></div>';
if(e.footprint_m)body+=e.kind==='manual_infrastructure'?'<div class="status">Costruzione manuale immediata · '+e.footprint_m.join(' × ')+' m · Nessun cubo, postazione o energia</div>':'<div class="status">Cubo chiuso: '+e.packed_inventory_units+' unità · Modulo aperto: '+e.footprint_m.join(' × ')+' m · '+e.power_kw+' kW</div>';
if(recipes.length)body+='<h2>Come si costruisce</h2>'+recipes.map(r=>'<p><b>'+esc(name(r.station))+'</b> · '+esc(name(r.research))+(r.category==='manual_construction'?' · Costruzione immediata · 0 s · 0 kWh · Nessun cubo':'')+'</p>'+costCards(r.inputs)).join('')+'<button class="primary" id="pin-recipe" data-pin="'+id+'">Segna come obiettivo</button><h3 style="margin-top:20px">Catena degli ingredienti</h3><ul class="dependencies">'+ingredientsTree(e.id.startsWith('recipe_')?Object.keys(e.outputs)[0]:e.id)+'</ul>';
if(e.crafting_recipes)body+='<h2 style="margin-top:22px">Cosa può costruire</h2>'+e.crafting_recipes.map(r=>'<button data-detail="'+r+'" style="margin:4px">'+esc(name(r))+'</button>').join('');
if(e.levels)body+='<h2>Livelli e costi</h2>'+e.levels.map(l=>'<div class="status"><b>Livello '+l.level+': '+esc(JSON.stringify(l.value))+'</b><br>'+esc(costs(l.cost_items))+'<br>'+esc(costs(l.cost_currency))+' · '+esc(name(l.required_research))+'</div>').join('');
body+='<h2 style="margin-top:24px">Dati per l’implementazione</h2><pre>'+esc(JSON.stringify(e,null,2))+'</pre>';$('#detail-content').innerHTML=body;if(!$('#details').open)$('#details').showModal();}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;render();}if(b.dataset.flow){state.flow=b.dataset.flow;render();}if(b.dataset.category){state.category=b.dataset.category;state.search='';render();}if(b.dataset.planet){state.planet=b.dataset.planet;render();}if(b.dataset.detail)detail(b.dataset.detail);if(b.id==='build-next'){state.buildStep=(state.buildStep+1)%4;render();}if(b.id==='close-details')$('#details').close();if(b.dataset.pin){state.pinned=b.dataset.pin;b.textContent='Obiettivo segnato: '+name(state.pinned);b.disabled=true;}});
document.addEventListener('change',ev=>{if(ev.target.id==='stage'){state.stage=ev.target.value;render();}if(ev.target.id==='obstruction'){state.blocked=ev.target.checked;render();}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){const n=ev.target.selectionStart;state.search=ev.target.value;render();$('#search').focus();$('#search').setSelectionRange(n,n);}});
render();
</script>
</body>
</html>
